[package]
name = "rust-os"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rust-os"
test = false
bench = false

[lib]
test = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
font8x8 = { version = "0.3.1", default-features = false, features = ["unicode"] }
limine = "0.6.5"

[package.metadata.limage]
run-command = [
    "qemu-system-x86_64",
    "-drive", "if=pflash,format=raw,readonly=on,file=/usr/share/edk2-ovmf/x64/OVMF_CODE.4m.fd",
    "-drive", "if=pflash,format=raw,file=OVMF_VARS.4m.fd",
    "-no-reboot",
    "-d", "int",
    "-cdrom", "{}"
]
